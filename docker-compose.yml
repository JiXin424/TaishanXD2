services:
  # ── PostgreSQL ──────────────────────────────────────────────────
  # postgres:
  #   image: postgres:16-alpine
  #   container_name: taishan-postgres
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_USER: ${PG_USER:-taishan}
  #     POSTGRES_PASSWORD: ${PG_PASSWORD:-taishan_dev}
  #     POSTGRES_DB: ${PG_DB:-taishan}
  #   ports:
  #     - "${PG_PORT:-5433}:5432"
  #   volumes:
  #     - ./.data/postgres:/var/lib/postgresql/data
  #     - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-taishan}"]
  #     interval: 5s
  #     timeout: 3s
  #     retries: 5
  #     start_period: 10s
  #   networks:
  #     - taishan-network

  # ── Redis ──────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: taishan-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-taishan_dev}
      --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ./.data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-taishan_dev}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - taishan-network

  # ── MongoDB ────────────────────────────────────────────────────
  mongo:
    image: mongo:7
    container_name: taishan-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-taishan}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-taishan_dev}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-taishan}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - ./.data/mongo:/data/db
      - ./docker/mongo/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - taishan-network

  # ── Go Backend ────────────────────────────────────────────────
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: taishan-server
    restart: unless-stopped
    environment:
      PORT: "4007"
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_USER: ${PG_USER:-taishan}
      PG_PASSWORD: ${PG_PASSWORD:-taishan_dev}
      PG_DB: ${PG_DB:-taishan}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-taishan_dev}
      MONGO_HOST: mongo
      MONGO_PORT: "27017"
      MONGO_USER: ${MONGO_USER:-taishan}
      MONGO_PASSWORD: ${MONGO_PASSWORD:-taishan_dev}
      MONGO_DB: ${MONGO_DB:-taishan}
      SESSION_SECRET: ${SESSION_SECRET:-change-me-in-production}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    ports:
      - "${PORT_GATEWAY:-4007}:4007"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4007/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - taishan-network

  # ── Next.js Frontend ──────────────────────────────────────────
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        BACKEND_URL: http://server:4007
    container_name: taishan-web
    restart: unless-stopped
    environment:
      BACKEND_URL: http://server:4007
    ports:
      - "${PORT_FRONTEND:-3000}:3000"
    depends_on:
      server:
        condition: service_healthy
    networks:
      - taishan-network

  # ── LLM Analysis Service (Python FastAPI + DashScope) ──────────
  llm-analysis:
    build: ./llm-analysis-service
    container_name: taishan-llm-analysis
    restart: unless-stopped
    env_file:
      - ./llm-analysis-service/.env
    environment:
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_DBNAME: ${PG_DB:-taishan}
      PG_USER: ${PG_USER:-taishan}
      PG_PASSWORD: ${PG_PASSWORD:-taishan_dev}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - taishan-network

  # ── Traefik (Gateway) ─────────────────────────────────────────
  traefik:
    image: traefik:v3.3
    container_name: taishan-traefik
    restart: unless-stopped
    command:
      - "--configFile=/etc/traefik/traefik.yml"
    ports:
      - "${TRAEFIK_HTTP_PORT:-80}:80"
      - "${TRAEFIK_DASHBOARD_PORT:-8081}:8080"
    volumes:
      - ./traefik:/etc/traefik:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - taishan-network

# ── Network ──────────────────────────────────────────────────────
networks:
  taishan-network:
    name: taishan-network
    driver: bridge
